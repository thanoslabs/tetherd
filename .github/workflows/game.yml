name: Game CI and Pages
on:
  push:
    branches: [main]
    paths: ['public/**','public/**','index.html','src/**','tests/**','package.json','package-lock.json','vite.config.js','.github/workflows/game.yml']
  pull_request:
    paths: ['index.html','src/**','tests/**','package.json','package-lock.json','vite.config.js','.github/workflows/game.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-game
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Support direct /play URL on GitHub Pages
        run: |
          mkdir -p dist/play
          cp dist/index.html dist/play/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
