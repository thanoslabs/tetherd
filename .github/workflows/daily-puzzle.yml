name: Generate daily puzzle
on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'UTC date (YYYY-MM-DD); optional single-date override'
        required: false
        type: string
permissions:
  contents: write
  actions: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and validate daily puzzle
        env:
          PUZZLE_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$PUZZLE_DATE" ]; then
            node scripts/generate-daily.mjs "$PUZZLE_DATE"
          else
            # Backfill today and tomorrow, and stage the puzzle two UTC days ahead.
            for offset in 0 1 2; do
              day=$(date -u -d "+$offset day" +%F)
              node scripts/generate-daily.mjs "$day"
            done
          fi
      - name: Commit published puzzle
        id: publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add puzzles/
          if git diff --cached --quiet; then
            echo 'Puzzle already generated'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: publish daily puzzle $(date -u +%F)"
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Trigger GitHub Pages deployment
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run game.yml --ref main
